# GitHubContributions/project.yml
# XcodeGen project spec for generating the Xcode project.
# Run `xcodegen generate` in this directory to create GitHubContributions.xcodeproj

name: GitHubContributions
options:
  bundleIdPrefix: com.contributions
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.35"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  GitHubContributions:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/GitHubContributions.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contributions.GitHubContributions
        PRODUCT_NAME: GitHubContributions
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/GitHubContributions.entitlements
        COMBINE_HIDPI_IMAGES: true
