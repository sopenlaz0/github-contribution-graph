name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build release
        run: |
          xcodebuild -project GitHubContributions.xcodeproj \
            -scheme GitHubContributions \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create DMG
        run: |
          APP_PATH="build/Build/Products/Release/GitHubContributions.app"

          # Create DMG contents with app + Applications symlink
          mkdir -p dmg_contents
          cp -R "$APP_PATH" dmg_contents/
          ln -s /Applications dmg_contents/Applications

          # Build the DMG
          hdiutil create \
            -volname "GitHub Contributions" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            GitHubContributions.dmg

          # Also zip for users who prefer it
          cd dmg_contents
          zip -r ../GitHubContributions.zip GitHubContributions.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GitHubContributions.dmg
            GitHubContributions.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
