name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build release
        run: |
          xcodebuild -project GitHubContributions.xcodeproj \
            -scheme GitHubContributions \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          APP_PATH="build/Build/Products/Release/GitHubContributions.app"
          mkdir -p release
          cp -R "$APP_PATH" release/
          cd release
          zip -r ../GitHubContributions.zip GitHubContributions.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: GitHubContributions.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
